<!DOCTYPE html>

	<meta name="viewport" content="width=device-width,initial-scale=1,minimal-ui">

	<!-- 共用 js -->

	<script language="javascript" type="text/javascript" src="js/public.js"></script>

	<!-- 共用外部 css 檔案 -->	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/fontawesome/fontawesome.css">
	<link rel="stylesheet" href="css/fontawesome/solid.css">

	<!-- 共用外部 js 檔案 在頁面最下方 -->

	<!-- 自訂 css -->
	<link rel="stylesheet" type="text/css" href="css/account.css">
	<link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/layout/footer.css">

	<!-- 自訂 js  -->

<body>
	<div data-header="sub" class="shopping-cart-header"></div>
	
	<main class="pb-5">
		<!-- 手機版 Left Side Menu -->
		<div class="mobile_menu_widget d-block d-lg-none">
			<div class="col-11 mx-auto py-2">
				<div class="row">
					<div class="col-6">
						<div class="dropdown">
							<button class="form-select border-0 border-bottom" type="button" id="dropdownMobileMainMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
								我的帳戶
							</button>
							<ul class="dropdown-menu mobile-main-menu" aria-labelledby="dropdownMobileMainMenuButton">
								<li class="dropdown-item">我的帳戶</li>
								<li class="dropdown-item">訂單中心</li>
								<li class="dropdown-item">配送/門市</li>
								<li class="dropdown-item">會員專屬</li>
							</ul>
						</div>
					</div>
					<div class="col-6">
						<button class="form-select border-0 border-bottom" type="button" id="dropdownMobileSubMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
							我的帳戶
						</button>
						<ul class="dropdown-menu mobile-sub-menu" aria-labelledby="dropdownMobileSubMenuButton">
							<li><a class="dropdown-item" href="#">個人資料</a></li>
							<li><a class="dropdown-item" href="#">綁定社群帳號</a></li>
							<li><a class="dropdown-item" href="#">發票設定</a></li>
							<li><a class="dropdown-item" href="#">密碼變更</a></li>
						</ul>
					</div>
				</div>
			</div>
		</div>
		
		<!-- 資料顯示區 -->
		<div class="container-xxl mt-3 mt-lg-5">
			<div class="row mx-auto">
				<!-- Left Side -->
				<div class="col-3">
					<!-- 這個Menu跟product list是共用的，請調整為一進來Menu是展開不用闔上 -->
					<!-- Left Side 紅利點數-->
					<div class="account-pointsBoxs">
						<div class="col">
							<span>紅利點數</span>
						</div>
						<div class="col-auto text-end d-flex align-items-center">
							<span class="text-mainYellow fs-2 fw-bold me-2">1400</span>
							<span>點</span>
						</div>
					</div>

					<!-- Left Side Menu -->
					<div class="sideMenu">
						<!-- <div class="sticky-top"> -->
							<aside class="aside_widget rounded">
								<div class="web_menu_widget d-none d-lg-block">
									<div class="accordion" id="accordionSideMenu">
										<!-- item01 -->
										<div class="accordion-item border-0">
											<h3 class="accordion-header" id="heading1">
												<button class="accordion-button side_widget_title" type="button" data-bs-toggle="collapse" data-bs-target="#collapse1" aria-expanded="true" aria-controls="collapse1">
													<picture class="me-2">
														<img src="images/svg-pic/doll-Gray.svg" alt="">
														<img src="images/svg-pic/doll-Gradient.svg" alt="">
													</picture>
													我的帳戶
												</button>
											</h3>
											<div id="collapse1" class="accordion-collapse collapse show" aria-labelledby="heading1" data-bs-parent="#accordionSideMenu">
												<div class="accordion-body">
													<ul class="ul_li_links">
														<li class=""><a href="#!">個人資料</a></li>
														<li class="active"><a href="#!">綁定社群帳號</a></li>
														<li class=""><a href="#!">發票設定</a></li>
														<li class=""><a href="#!">密碼變更</a></li>
													</ul>
												</div>
											</div>
										</div>
										<!-- item02 -->
										<div class="accordion-item border-0">
											<h3 class="accordion-header" id="heading1">
												<button class="accordion-button side_widget_title" type="button" data-bs-toggle="collapse" data-bs-target="#collapse2" aria-expanded="false" aria-controls="collapse2">
													<picture class="me-2">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gray.svg" alt="">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gradient.svg" alt="">
													</picture>
													訂單中心
												</button>
											</h3>
											<div id="collapse2" class="accordion-collapse collapse" aria-labelledby="heading2" data-bs-parent="#accordionSideMenu">
												<div class="accordion-body">
													<ul class="ul_li_links">
														<li class=""><a href="#!">訂單查詢</a></li>
														<li class=""><a href="#!">退貨紀錄</a></li>
													</ul>
												</div>
											</div>
										</div>
										<!-- item03 -->
										<div class="accordion-item border-0">
											<h3 class="accordion-header" id="heading1">
												<button class="accordion-button side_widget_title" type="button" data-bs-toggle="collapse" data-bs-target="#collapse3" aria-expanded="false" aria-controls="collapse3">
													<picture class="me-2">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gray.svg" alt="">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gradient.svg" alt="">
													</picture>
													配送/門市
												</button>
											</h3>
											<div id="collapse3" class="accordion-collapse collapse" aria-labelledby="heading3" data-bs-parent="#accordionSideMenu">
												<div class="accordion-body">
													<ul class="ul_li_links">
														<li class=""><a href="#!">常用收件人清單</a></li>
														<li class=""><a href="#!">門市收藏</a></li>
													</ul>
												</div>
											</div>
										</div>
										<!-- item04 -->
										<div class="accordion-item border-0">
											<h3 class="accordion-header" id="heading1">
												<button class="accordion-button side_widget_title" type="button" data-bs-toggle="collapse" data-bs-target="#collapse4" aria-expanded="false" aria-controls="collapse4">
													<picture class="me-2">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gray.svg" alt="">
														<img class="img-fluid mb-1" src="images/svg-pic/doll-Gradient.svg" alt="">
													</picture>
													會員專屬
												</button>
											</h3>
											<div id="collapse4" class="accordion-collapse collapse" aria-labelledby="heading4" data-bs-parent="#accordionSideMenu">
												<div class="accordion-body">
													<ul class="ul_li_links">
														<li class=""><a href="#!">紅利點數</a></li>
														<li class=""><a href="#!">優惠劵</a></li>
														<li class=""><a href="#!">我的最愛</a></li>
														<li class=""><a href="#!">商品瀏覽紀錄</a></li>
													</ul>
												</div>
											</div>
										</div>
									</div>
								</div>
							</aside>
						<!-- </div> -->
					</div>
				</div>

				<!-- Right Side -->
				<div class="col-md-9 col-12">
					<div class="row mx-auto">
						<div class="col-auto account-redLine pt-0 pb-2 fs-4 fw-semi">綁定社群帳號</div>
						<div class="col account-grayLine"></div>
					</div>

					<div class="row mx-auto border-bottom">
						<div class="col-12 pt-3 px-0">
							<ul class="fs-8 fw-light text-gray002 mb-3">
								<li>您的帳號尚未連結 社群帳號。如欲連結帳號，請點 選『綁定』變更。</li>
							</ul>
						</div>
					</div>
					
					<!-- 第1欄 -->
					<div class="row mx-auto border-bottom-dotted align-items-center py-4">
						<div class="col-auto">
							<button class="account-socialBtn-Line active">
							<i class="icon-icon-line align-baseline me-2"></i>	Line
							</button>
						</div>
						<div class="col-md-5 col-auto pt-0">
							<span class="fs-7">已綁定</span>
						</div>
						<div class="col-auto ms-auto pt-0">
							<button class="btnSF btnBlud003-line btn-xl fs-8 fw-medium">解除綁定</button>
						</div>
					</div>

					<!-- 第2欄 -->
					<div class="row mx-auto border-bottom-dotted align-items-center py-4">
						<div class="col-auto">
							<button class="account-socialBtn-google">
								<i class="bi bi-google align-baseline me-2"></i>Google
							</button>
						</div>
						<div class="col-md-5 col-auto pt-0">
							<span class="fs-7 text-gray003">未綁定</span>
						</div>
						<div class="col-auto ms-auto pt-0">
							<button class="btnSF btnBlud003-line btn-xl fs-8 fw-medium">綁定</button>
						</div>
					</div>

					<!-- 第3欄 -->
					<div class="row mx-auto border-bottom-dotted align-items-center py-4">
						<div class="col-auto">
							<button class="account-socialBtn-face">
							<i class="icon-icon-fb align-baseline me-2"></i>Facebook
							</button>
						</div>
						<div class="col-md-5 col-auto pt-0">
							<span class="fs-7 text-gray003">未綁定</span>
						</div>
						<div class="col-auto ms-auto pt-0">
							<button class="btnSF btnBlud003-line btn-xl fs-8 fw-medium">綁定</button>
						</div>
					</div>


				</div>

		crossorigin="anonymous"></script>

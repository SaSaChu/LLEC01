<header class="site-header header--main">

  <div class="site-header__top">
    <div class="container site-header__top-inner">

      <nav class="site-header__top-nav">
        <a href="#">回首頁</a>
        <a href="#">關於我們</a>
        <a href="#">聯絡我們</a>
        <a href="#">隱私權政策</a>
      </nav>

      <div class="site-header__marquee">
        <div class="site-header__marquee-mask">
          <div class="site-header__marquee-text">跑馬燈文字顯示區域</div>
        </div>
      </div>

      <nav class="site-header__member-nav">
        <a href="#">會員中心</a>
        <a href="#">折價券</a>
        <a href="#">訂單查詢</a>
        <a href="#">購物車</a>
      </nav>

    </div>
  </div>

  <div class="site-header__main">
    <div class="container site-header__main-inner">

      <a href="#" class="site-header__logo">
        <img src="images/logo.png" alt="Logo">
      </a>

      <div class="site-header__search">
        <div class="site-header__search-category">所有分類</div>
        <input type="text" placeholder="搜尋商品關鍵字">
        <button type="button" class="site-header__search-submit">搜尋</button>
      </div>

      <div class="site-header__icons">

        <button type="button" class="site-header__icon-btn site-header__icon-btn--search" aria-label="搜尋">
          <span class="site-header__icon-circle">
            <span class="site-header__icon site-header__icon--search"></span>
          </span>
        </button>

        <button type="button" class="site-header__icon-btn site-header__icon-btn--member js-login-open" aria-label="會員登入">
          <span class="site-header__icon-circle">
            <span class="site-header__icon site-header__icon--member"></span>
          </span>
        </button>

        <button type="button" class="site-header__icon-btn js-mobile-menu-open" aria-label="收藏">
          <span class="site-header__icon-circle">
            <span class="site-header__icon site-header__icon--heart"></span>
          </span>
        </button>

        <button type="button" class="site-header__icon-btn js-mobile-menu-open" aria-label="購物車">
          <span class="site-header__icon-circle">
            <span class="site-header__icon site-header__icon--cart"></span>
          </span>
          <span class="site-header__cart-count">2</span>
        </button>

      </div>

    </div>
  </div>

  <div class="site-header__visual">

    <div class="site-header__nav-wrap">
      <div class="container">

        <div class="site-header__nav">

          <nav class="site-header__category-nav">
            <a href="#">商品選單01</a>
            <a href="#">商品選單02</a>
            <a href="#">商品選單03</a>
            <a href="#">商品選單04</a>
            <a href="#">商品選單05</a>
          </nav>

          <a href="#" class="site-header__sale">
            <span>現在加入立即享 7 折優惠</span>
            <strong>SALE</strong>
          </a>

        </div>

      </div>
    </div>

    <div class="site-header__mobile-nav">

      <button type="button" class="site-header__mobile-menu-btn js-mobile-menu-open">
        <i class="bi bi-list"></i>
        <span>Menu選單</span>
      </button>

      <div class="site-header__mobile-notice">
        <div class="site-header__mobile-marquee">
          <span>跑馬燈文字顯示區域</span>
        </div>
      </div>

    </div>

    <div class="site-header__banner">
      <picture>
        <source media="(max-width: 767.98px)" srcset="images/m-banner.png">
        <img src="images/banner.png" alt="">
      </picture>
    </div>

  </div>

  <div class="mobile-menu-overlay js-mobile-menu-overlay"></div>

  <aside class="mobile-menu js-mobile-menu">

    <div class="mobile-menu__header">

      <a href="#" class="mobile-menu__logo">
        <img src="images/logo.png" alt="Logo">
      </a>

      <button type="button" class="mobile-menu__close js-mobile-menu-close" aria-label="關閉選單">
        <i class="bi bi-x-lg"></i>
      </button>

    </div>

    <div class="mobile-menu__member">
      <a href="#" class="mobile-menu__login">登入</a>
      <a href="#" class="mobile-menu__register">註冊</a>
    </div>

    <nav class="mobile-menu__nav">
      <a href="#">商品選單01</a>
      <a href="#">商品選單02</a>
      <a href="#">商品選單03</a>
      <a href="#">商品選單04</a>
      <a href="#">商品選單05</a>
    </nav>

    <div class="mobile-menu__social">
      <span>追蹤我們</span>

      <div class="mobile-menu__social-list">
        <a href="#" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
        <a href="#" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
        <a href="#" aria-label="LINE"><i class="bi bi-whatsapp"></i></a>
        <a href="#" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
      </div>
    </div>

  </aside>


  <div class="login-modal js-login-modal" aria-hidden="true">
    <div class="login-modal__overlay js-login-close"></div>
    <div class="login-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
      <button type="button" class="login-modal__close js-login-close" aria-label="關閉登入視窗">×</button>
      <h2 id="login-modal-title" class="login-modal__title">會員登入</h2>
      <form class="login-modal__form">
        <input class="login-modal__input" type="tel" inputmode="numeric" placeholder="手機號碼" aria-label="手機號碼">
        <input class="login-modal__input" type="password" placeholder="8-16碼英數混合，區分大小寫" aria-label="密碼">
        <div class="login-modal__captcha-row">
          <input class="login-modal__input login-modal__captcha-input" type="text" placeholder="驗證碼" aria-label="驗證碼">
          <div class="login-modal__captcha" aria-label="驗證碼圖片">4667</div>
          <button type="button" class="login-modal__refresh" aria-label="重新產生驗證碼">↻</button>
        </div>
        <a class="login-modal__forgot" href="#"><i class="bi bi-lock"></i><span>忘記密碼</span></a>
        <button type="submit" class="login-modal__submit">登入/註冊</button>
        <div class="login-modal__or"><span>or</span></div>
        <button type="button" class="login-modal__line"><span class="login-modal__line-mark">LINE</span><span>快速登入</span></button>
        <p class="login-modal__terms">登入或完成註冊代表您同意 <a href="#">隱私條款</a> 和 <a href="#">使用條款</a></p>
      </form>
    </div>
  </div>

</header>
